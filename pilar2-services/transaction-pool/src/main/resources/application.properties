# Server
server.port=8082

# Application
spring.application.name=transaction-pool

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:redis123}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:blockchain}

# Pool configuration
pool.block-interval=60
pool.default-prefix=000
pool.range-size=1000000

# Services
services.coordinator.url=${COORDINATOR_URL:http://localhost:8081}

# Logging
logging.level.com.blockchain=DEBUG