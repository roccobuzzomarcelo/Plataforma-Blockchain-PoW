# Proxy reverso del frontend
# ---------------------------------------------------------------------------
# El navegador solo habla con este nginx (mismo origen). nginx sirve el SPA y
# reenvia las llamadas a los servicios internos por su nombre de servicio:
#   - blockchain-api:8080   -> /api/chain, /api/transactions, /ws (STOMP/SockJS)
#   - transaction-pool:8082 -> /api/pool (status, flush)
# Los nombres coinciden con los servicios de docker-compose y con los Services
# de Kubernetes, asi que este mismo archivo sirve en los dos entornos.

# Cabecera Connection para WebSocket: "upgrade" si el cliente pide upgrade,
# "close" en cualquier otro caso.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream blockchain_api {
    server blockchain-api:8080;
}

upstream transaction_pool {
    server transaction-pool:8082;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras comunes hacia los servicios (se heredan en los location)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Endpoints internos: NO se exponen al navegador ----------------------
    # El coordinator notifica bloques minados a blockchain-api por esta ruta.
    location /api/events/ {
        return 404;
    }
    # Keep-alive de los mineros GPU hacia el pool (P5).
    location /api/pool/miners/ {
        return 404;
    }

    # --- transaction-pool ----------------------------------------------------
    location /api/pool/ {
        proxy_pass http://transaction_pool;   # sin URI: el path se reenvia intacto
    }

    # --- blockchain-api: REST ------------------------------------------------
    location /api/ {
        proxy_pass http://blockchain_api;
    }

    # --- blockchain-api: WebSocket STOMP sobre SockJS ------------------------
    location /ws {
        proxy_pass http://blockchain_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;                # conexiones de larga duracion
        proxy_send_timeout 1h;
        proxy_buffering off;                  # necesario para los transportes de streaming de SockJS
    }

    # --- SPA -----------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}