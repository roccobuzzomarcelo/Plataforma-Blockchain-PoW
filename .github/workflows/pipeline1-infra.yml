# Pipeline 1 - Construccion y configuracion del entorno Kubernetes (3.2)
#
# Aplica pilar3-infra/opentofu: VPC, subred, cluster GKE, node pools y las
# VMs mineras externas (la plantilla, no el tamano -eso es Pipeline 4).
#
# Por diseno, el "apply" real SOLO corre con el boton manual
# (workflow_dispatch). En cada push o PR que toque este directorio se
# corre unicamente "tofu plan", como chequeo -nunca se aplica sola una
# modificacion de VPC/cluster sin que un humano la revise primero, la
# misma disciplina que se uso a mano durante todo el desarrollo.
name: "Pipeline 1 - Infraestructura (OpenTofu)"

on:
  push:
    branches: [main]
    paths: ["pilar3-infra/opentofu/**"]
  pull_request:
    paths: ["pilar3-infra/opentofu/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar los cambios (no solo plan)"
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sdypp-rocco' }}

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilar3-infra/opentofu
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_OPENTOFU_SA_KEY }}

      # provider.tf lee las credenciales con file(var.credentials_file), y
      # el default de esa variable es una ruta local (~/.gcp/opentofu-key.json,
      # la misma que se usa en las corridas interactivas). No lee la
      # autenticacion que arriba deja lista google-github-actions/auth -asi
      # que se escribe el secret ahi mismo, para que sea exactamente la
      # misma ruta que ya funciona en local, sin tocar provider.tf.
      - name: Escribir credenciales para OpenTofu
        run: |
          mkdir -p ~/.gcp
          echo '${{ secrets.GCP_OPENTOFU_SA_KEY }}' > ~/.gcp/opentofu-key.json

      - uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: tofu init
        run: tofu init

      - name: tofu plan
        run: tofu plan -input=false -out=tfplan -var="project_id=${{ env.GCP_PROJECT_ID }}"

      # Solo aplica con el boton manual (workflow_dispatch) y apply=true.
      # push/PR se quedan en el plan de arriba como chequeo.
      # inputs.* siempre llega como texto en workflow_dispatch, aunque el
      # input este declarado type: boolean -por eso se compara con 'true'.
      - name: tofu apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == 'true'
        run: tofu apply -input=false -auto-approve tfplan
