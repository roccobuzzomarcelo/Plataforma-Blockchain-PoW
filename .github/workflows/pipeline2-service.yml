# Pipeline 2 - Despliegue de servicios fundamentales: Redis y RabbitMQ (3.2)
#
# Aplica namespaces, secrets, y los StatefulSets de infra sobre el cluster
# ya creado por Pipeline 1. kubectl apply es declarativo e idempotente,
# asi que a diferencia de Pipeline 1 esto SI se aplica solo al pushear a
# main (no solo se planea).
name: "Pipeline 2 - Redis y RabbitMQ"

on:
  push:
    branches: [main]
    paths:
      - "pilar3-infra/k8s/namespaces.yaml"
      - "pilar3-infra/k8s/secrets.yaml"
      - "pilar3-infra/k8s/infra/**"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sdypp-rocco' }}
  GKE_CLUSTER: blockchain-cluster
  GKE_ZONE: us-central1-a

jobs:
  deploy-infra-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CI_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Namespaces y Secrets
        run: |
          kubectl apply -f pilar3-infra/k8s/namespaces.yaml
          kubectl apply -f pilar3-infra/k8s/secrets.yaml

      - name: Redis y RabbitMQ
        run: |
          kubectl apply -f pilar3-infra/k8s/infra/redis.yaml
          kubectl apply -f pilar3-infra/k8s/infra/rabbitmq.yaml

      - name: Esperar a que queden sanos
        run: |
          kubectl rollout status statefulset/redis    -n blockchain-infra --timeout=180s
          kubectl rollout status statefulset/rabbitmq -n blockchain-infra --timeout=180s
