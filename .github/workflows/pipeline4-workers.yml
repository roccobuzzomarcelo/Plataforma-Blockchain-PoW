# Pipeline 4 - Despliegue de VMs que actuan como nodos de trabajo
# adicionales (3.2). Los mineros CPU externos al cluster (3.1); se
# ajustan "cuando sea necesario" (P5), no de forma completamente
# autonoma -es una decision de diseno documentada: con solo 0-1 VM de
# base, un autoscaler por CPU no tiene forma de "despertar" desde cero,
# asi que el ajuste queda como una accion explicita y auditable, en vez
# de automatica. Este pipeline es justamente ese mecanismo: envolver el
# "gcloud resize" manual en un botón versionado y con historial, en
# lugar de un comando suelto en una terminal.
#
# Solo por boton manual (workflow_dispatch): agregar o quitar mineros
# es una decision operativa puntual, no algo que deba dispararse solo
# en cada push.
name: "Pipeline 4 - VMs mineras externas"

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Cantidad de VMs mineras (0 = apagadas)"
        type: number
        default: 1
      recreate:
        description: "Recrear las VMs existentes (imagen/config nueva) en vez de solo ajustar el tamano"
        type: boolean
        default: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sdypp-rocco' }}
  GCP_ZONE: us-central1-a
  MIG_NAME: external-miner-mig

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CI_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Recrear instancias existentes (opcional)
        if: inputs.recreate == 'true'
        run: |
          INSTANCES=$(gcloud compute instance-groups managed list-instances "$MIG_NAME" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" \
            --format="value(instance)" | paste -sd, -)
          if [ -n "$INSTANCES" ]; then
            gcloud compute instance-groups managed recreate-instances "$MIG_NAME" \
              --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" --instances="$INSTANCES"
          else
            echo "No hay instancias para recrear (grupo en 0)."
          fi

      - name: Ajustar cantidad de VMs mineras
        run: |
          gcloud compute instance-groups managed resize "$MIG_NAME" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" --size="${{ inputs.size }}"

      - name: Estado del grupo
        run: |
          gcloud compute instance-groups managed list-instances "$MIG_NAME" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID"
