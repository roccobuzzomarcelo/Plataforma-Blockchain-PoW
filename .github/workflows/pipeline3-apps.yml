# Pipeline 3 - Implementacion de cada aplicacion: frontend, blockchain-api
# (backend), transaction-pool (split), coordinator (join), worker (3.2)
#
# Construye y publica las 5 imagenes en Artifact Registry, aplica los
# Deployments/Services y fuerza un rollout restart para que los pods
# tomen la imagen recien publicada (el tag es siempre :latest con
# imagePullPolicy: Always, asi que el pull trae la version nueva).
name: "Pipeline 3 - Aplicaciones"

on:
  push:
    branches: [main]
    paths:
      - "pilar2-services/**"
      - "pilar3-infra/k8s/apps/**"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sdypp-rocco' }}
  GCP_REGION: us-central1
  ARTIFACT_REPO: blockchain-repo
  GKE_CLUSTER: blockchain-cluster
  GKE_ZONE: us-central1-a

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: blockchain-api/Dockerfile
            image: blockchain-api
            deployment: blockchain-api
          - dockerfile: coordinador/Dockerfile
            image: coordinator
            deployment: coordinator
          - dockerfile: transaction-pool/Dockerfile
            image: transaction-pool
            deployment: transaction-pool
          - dockerfile: worker/Dockerfile
            image: worker
            deployment: worker
          - dockerfile: frontend/Dockerfile
            image: blockchain-frontend
            deployment: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CI_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Contexto pilar2-services/: todos los Dockerfiles construyen
      # shared/ como parte del build (ver Dockerfile de cada servicio).
      - name: Build y push - ${{ matrix.image }}
        working-directory: pilar2-services
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ matrix.image }}:latest"
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CI_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Aplicar manifiestos
        run: kubectl apply -f pilar3-infra/k8s/apps/

      - name: Rollout restart (toma la imagen recien publicada)
        run: |
          for d in blockchain-api coordinator transaction-pool worker frontend; do
            kubectl rollout restart deployment/$d -n blockchain-apps
          done

      - name: Esperar a que los 5 queden sanos
        run: |
          for d in blockchain-api coordinator transaction-pool worker frontend; do
            kubectl rollout status deployment/$d -n blockchain-apps --timeout=300s
          done
