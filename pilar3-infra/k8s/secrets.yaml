# Los Secrets son por namespace: como infra y apps están separados,
# cada credencial se declara una vez en cada namespace que la necesita.
# Mismos valores que ya usa docker-compose.yml (redis123 / admin-admin123),
# tal como se definió para este despliegue.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: blockchain-infra
type: Opaque
stringData:
  REDIS_PASS: "redis123"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: blockchain-apps
type: Opaque
stringData:
  REDIS_PASS: "redis123"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: blockchain-infra
type: Opaque
stringData:
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "admin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: blockchain-apps
type: Opaque
stringData:
  RABBITMQ_USER: "admin"
  RABBITMQ_PASS: "admin123"
