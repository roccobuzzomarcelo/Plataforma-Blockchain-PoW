apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-api
  namespace: blockchain-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blockchain-api
  template:
    metadata:
      labels:
        app: blockchain-api
    spec:
      nodeSelector:
        pool: apps
      containers:
        - name: blockchain-api
          image: us-central1-docker.pkg.dev/sdypp-rocco/blockchain-repo/blockchain-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis.blockchain-infra.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASS
            - name: TRANSACTION_POOL_URL
              value: "http://transaction-pool:8082"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-api
  namespace: blockchain-apps
spec:
  selector:
    app: blockchain-api
  ports:
    - port: 8080
      targetPort: 8080
